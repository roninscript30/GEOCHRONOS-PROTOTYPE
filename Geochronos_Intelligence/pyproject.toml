[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geochronos-intelligence-engine"
version = "0.1.0"
description = "GeoChronos Intelligence Engine for semantic retrieval and temporal analysis"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["geochronos_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
